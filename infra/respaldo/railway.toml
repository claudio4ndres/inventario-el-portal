# Configuración del servicio "respaldo-mysql" en Railway (raíz: /infra/respaldo).
# Evita que se aplique el railway.json de la raíz del repositorio, que es de la
# aplicación web (healthcheck /up). Los mismos valores están en la configuración
# del servicio, que es la que rige desde que Railway retire Config as Code.
[build]
builder = "DOCKERFILE"

[deploy]
# 07:00 UTC = 04:00 en Chile (horario de verano), antes de abrir el almacén.
cronSchedule = "0 7 * * *"
restartPolicyType = "NEVER"
