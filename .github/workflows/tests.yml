name: Pruebas

# CI: cada push o pull request a develop/main ejecuta las pruebas automatizadas.
# Una rama solo se integra si este flujo termina en verde (control de calidad, plan 3.5).
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  phpunit-sqlite:
    name: PHPUnit (SQLite en memoria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -o pipefail
          php artisan test --no-ansi --log-junit junit.xml 2>&1 | tee test-output.txt
      - name: Publicar fallos como anotaciones
        if: failure()
        run: python3 .github/scripts/junit_annotations.py junit.xml test-output.txt

  phpunit-mysql:
    name: PHPUnit (MySQL 8.4, motor de producción)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventario_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: inventario_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Ejecutar pruebas sobre MySQL
        # Las variables DB_* del job tienen prioridad: PHPUnit no sobrescribe variables ya definidas
        shell: bash
        run: |
          set -o pipefail
          php artisan test --no-ansi --log-junit junit.xml 2>&1 | tee test-output.txt
      - name: Publicar fallos como anotaciones
        if: failure()
        run: python3 .github/scripts/junit_annotations.py junit.xml test-output.txt
